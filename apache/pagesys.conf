# /etc/apache2/sites-available/pagesys.conf
# Enable with: sudo a2ensite pagesys && sudo systemctl reload apache2

<VirtualHost *:80>
    ServerName pagesys.acatche.com

    # -- Static React build -----------------------------------------
    DocumentRoot /var/www/pagesys/client

    <Directory /var/www/pagesys/client>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted

        # React Router — serve index.html for all routes
        RewriteEngine On
        RewriteBase /
        RewriteRule ^index\.html$ - [L]
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule . /index.html [L]
    </Directory>

    # -- API proxy → Node.js on :3001 --------------------------------
    ProxyRequests Off
    ProxyPreserveHost On

    ProxyPass        /api/  http://127.0.0.1:3001/api/
    ProxyPassReverse /api/  http://127.0.0.1:3001/api/

    # Uploaded faculty photos
    ProxyPass        /uploads/  http://127.0.0.1:3001/uploads/
    ProxyPassReverse /uploads/  http://127.0.0.1:3001/uploads/

    # -- Socket.io WebSocket proxy -----------------------------------
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule /socket.io/(.*) ws://127.0.0.1:3001/socket.io/$1 [P,L]
    RewriteCond %{HTTP:Upgrade} !=websocket [NC]
    RewriteRule /socket.io/(.*) http://127.0.0.1:3001/socket.io/$1 [P,L]

    ProxyPass        /socket.io/  http://127.0.0.1:3001/socket.io/
    ProxyPassReverse /socket.io/  http://127.0.0.1:3001/socket.io/

    ErrorLog  ${APACHE_LOG_DIR}/pagesys-error.log
    CustomLog ${APACHE_LOG_DIR}/pagesys-access.log combined
</VirtualHost>

# HTTPS — uncomment after running: sudo certbot --apache -d pagesys.acatche.com
